name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: python3 scripts/verify.py
      - run: .venv/bin/python scripts/benchmark.py --replay tests/fixtures/ --runs 5
      - run: npx playwright install chromium
        working-directory: frontend
      - name: Verify Studio replay
        run: |
          .venv/bin/python scripts/dev.py --port 5174 > studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5174/api/health; then break; fi
            sleep 1
          done
          (cd frontend && npx playwright test --reporter=line) || { cat studio.log; exit 1; }
