[project]
name = "kineticdesk"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "websockets==15.0.1",
  "mediapipe==0.10.32",
  "opencv-contrib-python==4.11.0.86",
  "numpy==2.2.6",
  "PyAutoGUI==0.9.54",
  "pyobjc-framework-AVFoundation==11.1; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.9", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
